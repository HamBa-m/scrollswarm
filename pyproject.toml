[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrollswarm"
version = "0.1.0"
description = "A 2D multi-agent reinforcement learning (MARL) testbed for cooperative UAV swarm reconnaissance, obstacle avoidance, and graph communication."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "numpy>=2.5.5",
    "pettingzoo>=1.27.0",
    "pygame>=2.6.1",
    "pytest>=9.2.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "pillow>=13.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scrollswarm"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
