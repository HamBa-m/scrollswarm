site_name: ScrollSwarm
site_description: "A side-scrolling multi-agent reinforcement learning (MARL) testbed with dynamic planetary ring kinematics and graph communication."
site_author: "Hamza Ba-mohammed"
repo_url: "https://github.com/HamBa-m/scrollswarm"
repo_name: "HamBa-m/scrollswarm"

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_root_heading: true
            show_source: true
            heading_level: 2

nav:
  - Overview: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Environment Specification:
      - Formal Model: environment/overview.md
      - Observation & LiDAR: environment/observation.md
      - Action Space & Dynamics: environment/action_space.md
      - Ring Dynamics & Asteroids: environment/ring_dynamics.md
      - Rewards & CTDE State: environment/rewards_and_state.md
      - Graph Communication: environment/communication.md
  - Tutorials:
      - "01: PettingZoo ParallelEnv Loop": tutorials/01_parallel_env.md
      - "02: Heuristic Reactive Policy": tutorials/02_heuristic_baseline.md
      - "03: PyG & GNN Integration": tutorials/03_gnn_pyg.md
  - API Reference:
      - ScrollSwarmEnv: api/env.md
      - Agent & Dynamics: api/agent.md
      - Sensors & Raycasting: api/sensors.md
      - Communication Graph: api/comm.md
      - Map & Ring Environment: api/map.md
      - Sprites & Rendering: api/sprites.md
