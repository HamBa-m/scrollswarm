[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrollswarm"
version = "0.1.0"
description = "A side-scrolling multi-agent reinforcement learning (MARL) testbed with procedural topography and dynamic graph communication."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "numpy>=2.5.5",
    "pettingzoo>=1.27.0",
    "pygame>=2.6.1",
    "pytest>=9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scrollswarm"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
